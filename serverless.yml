# Akpa Management serveless file.
#
# For full config options, check the docs:
#    docs.serverless.com
#

service: ruelles-backend
org: projetruelles

# To minimize the size of each lambda function code based lambada
# it is possible to remove unused code for deploy. This section
# starts by removing everything from the project. In the functions
# section below, each function has its own package defined to minize
# its footprint in AWS
package:
  individually: true
  patterns:
    - '!./node_modules/**'
    - '!./src/**'

plugins:
  - serverless-dotenv-plugin

# app and org for use with dashboard.serverless.com
custom:
  myStage: ${opt:stage, self:provider.stage}
  myEnvironment:
    MESSAGE:
      prod: "This is production environment"
      dev: "This is development environment"
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node24
    platform: node
    external:
      - aws-sdk


# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
frameworkVersion: '>=4.0.0'




provider:
  name: aws
  stage: dev
  region: us-east-1
  runtime: nodejs24.x
  environment:
    BEDROCK_KB_ID: ${env:BEDROCK_KB_ID}  
  logRetentionInDays: 5
  httpApi:
    name: "${self:service}-${self:provider.stage}"
    cors: true
    authorizers:
      auth0Jwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://ruelles-limoilou-dev.ca.auth0.com/
        audience:
          - https://ruelles-limoilou-dev.ca.auth0.com/api/v2/
      
    
  # iam:    
  #   role:
  #     # All lambdas inherits this default IAM role 
  #     name: ruellesBackendDefaultRole
  #     path: /ruelles/backend/default/${self:custom.myStage}/


functions:
  # Bedrock handler
  ask:
    handler: src/bedrock/bedrockHandler.ask
    role: ruellesBackendDefaultRole
    description: Used to send a question to the AI model
    url:
      cors: true
      invokeMode: RESPONSE_STREAM
    environment: ${file(./environmentVariables.${self:custom.myStage}.json)}
    package:
      individually: true
      patterns:
        - './src/*'
        - './src/bedrock/**'
    timeout: 20
    events:
      - httpApi:
          path: /bedrock/ask
          method: post
          authorizer:
            name: auth0Jwt

resources:
  Resources:
    ruellesBackendDefaultRole:
      Type: AWS::IAM::Role
      Properties:
        Path: /akpa/gateway/default/${self:custom.myStage}/
        RoleName: ruelles-backend-default-role-${self:custom.myStage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ruelles-backend-default-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # LogGroup permissions
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - Fn::Join:
                        - ':'
                        - - arn:aws:logs
                          - Ref: AWS::Region
                          - Ref: AWS::AccountId
                          - log-group:/aws/lambda/*:*:*
                # Bedrock permissions
                - Effect: Allow
                  Action:
                    - bedrock:RetrieveAndGenerate
                    - bedrock:Retrieve
                  Resource:
                    - arn:aws:bedrock:us-east-1:568680554314:knowledge-base/${env:BEDROCK_KB_ID}
                # Knowledge base permissions
                - Effect: Allow
                  Action:
                    - bedrock:RetrieveAndGenerate
                    - bedrock:Retrieve
                  Resource:
                    - arn:aws:bedrock:us-east-1:568680554314:knowledge-base/${env:BEDROCK_KB_ID}
                # Inference profile permissions         
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                    - bedrock:InvokeModelWithResponseStream
                    - bedrock:GetInferenceProfile
                  Resource:
                    - arn:aws:bedrock:us-east-1:568680554314:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                    # Standard Foundation Model ARN (Global)
                    - arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0                    
                    - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                    # OR simply use a wildcard for all Claude models:
                    # - arn:aws:bedrock:::foundation-model/anthropic.claude-*
